name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify & Build
        run: deno task verify

      - name: Package connector
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          PKG_NAME="gety-siyuan-connector-${VERSION}"
          mkdir -p "release/${PKG_NAME}"
          cp manifest.json "release/${PKG_NAME}/"
          cp dist/main.js "release/${PKG_NAME}/"
          cp dist/main.js.map "release/${PKG_NAME}/"
          cp icon.svg icon.png "release/${PKG_NAME}/"
          cp README.md LICENSE CHANGELOG.md "release/${PKG_NAME}/"
          cd release
          zip -r "${PKG_NAME}.zip" "${PKG_NAME}"
          sha256sum "${PKG_NAME}.zip" > "${PKG_NAME}.zip.sha256"
          echo "PACKAGE=release/${PKG_NAME}.zip" >> "$GITHUB_ENV"
          echo "PACKAGE_SHA=release/${PKG_NAME}.zip.sha256" >> "$GITHUB_ENV"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.PACKAGE }}
            ${{ env.PACKAGE_SHA }}
